name: WORKLOG Store Screenshots Commit

on:
  push:
    branches:
      - develop/worklog-0.9.0-assets-readme-polish

permissions:
  contents: write

concurrency:
  group: worklog-store-screenshots-commit-v2
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/worklog-0.9.0-assets-readme-polish
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dohvati pakete
        run: flutter pub get
      - name: Generiraj Android i Apple screenshotove
        run: flutter test tool/store_screenshots_test.dart
      - name: Pripremi store direktorije
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/screenshots
          rm -rf store/android/screenshots/phone
          rm -rf store/ios/screenshots/iphone-6.9
          rm -rf store/ios/screenshots/ipad-13
          mkdir -p docs/screenshots
          mkdir -p store/android/screenshots/phone
          mkdir -p store/ios/screenshots/iphone-6.9
          mkdir -p store/ios/screenshots/ipad-13

          cp tool/generated-screenshots/iphone-6.9/*.png docs/screenshots/
          cp tool/generated-screenshots/android-phone/*.png store/android/screenshots/phone/
          cp tool/generated-screenshots/iphone-6.9/*.png store/ios/screenshots/iphone-6.9/
          cp tool/generated-screenshots/ipad-13/*.png store/ios/screenshots/ipad-13/

      - name: Ukloni alpha kanal i provjeri store PNG datoteke
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/normalize_store_png.py             'store/android/screenshots/phone/*.png'             'store/ios/screenshots/iphone-6.9/*.png'             'store/ios/screenshots/ipad-13/*.png'

      - name: Provjeri obavezne dimenzije
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = {
              Path('store/android/screenshots/phone'): (1080, 1920),
              Path('store/ios/screenshots/iphone-6.9'): (1320, 2868),
              Path('store/ios/screenshots/ipad-13'): (2064, 2752),
          }

          for directory, size in expected.items():
              files = sorted(directory.glob('*.png'))
              if len(files) < 4:
                  raise SystemExit(f'{directory}: očekivano najmanje 4 screenshotova')
              for path in files:
                  data = path.read_bytes()
                  width, height = struct.unpack('>II', data[16:24])
                  if (width, height) != size:
                      raise SystemExit(
                          f'{path}: {width}x{height}, očekivano {size[0]}x{size[1]}'
                      )
                  color_type = data[25]
                  if color_type != 2:
                      raise SystemExit(f'{path}: PNG color type {color_type}, očekivano RGB=2')
                  print(f'{path}: {width}x{height} RGB')
          PY

      - name: Commitaj store screenshotove
        shell: bash
        run: |
          set -euo pipefail
          git add docs/screenshots store/android/screenshots store/ios/screenshots
          if git diff --cached --quiet; then
            echo "Screenshotovi su već ažurni."
            exit 0
          fi
          git config user.name "WORKLOG CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "assets: uskladi Android i Apple screenshot pakete sa store pravilima"
          git push origin HEAD:develop/worklog-0.9.0-assets-readme-polish
