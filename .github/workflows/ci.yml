name: WORKLOG CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Analiza i testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generiraj Android/iOS platformu
        run: flutter create --org com.brendigo --project-name worklog --platforms android,ios .
      - name: Dohvati pakete
        run: flutter pub get
      - name: Analiza
        run: flutter analyze
      - name: Testovi
        run: flutter test

  android:
    name: Android produkcijski APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.brendigo --project-name worklog --platforms android,ios .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: WORKLOG-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS produkcijski build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.brendigo --project-name worklog --platforms android,ios .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
