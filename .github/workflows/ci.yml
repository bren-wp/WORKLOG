name: WORKLOG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worklog-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analiza i testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Provjeri Python alate
        run: python3 -m py_compile tool/configure_platforms.py tool/generate_brand_assets.py
      - name: Provjeri PHP backend
        shell: bash
        run: |
          set -euo pipefail
          find web -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check web/assets/app.js
          grep -q 'Require all denied' web/.htaccess
          test -s web/database/schema.sql
          grep -q 'CREATE TABLE users' web/database/schema.sql
          grep -q 'CREATE TABLE auth_sessions' web/database/schema.sql
      - name: Generiraj Android/iOS platformu
        run: flutter create --org com.brendigo --project-name worklog --platforms android,ios .
      - name: Konfiguriraj platforme i branding
        run: python3 tool/configure_platforms.py
      - name: Provjeri store i platform assete
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/brand/generated/worklog-app-icon-1024.png
          test -s store/android/assets/worklog-app-icon-512.png
          test -s store/android/assets/worklog-feature-graphic-1024x500.png
          test -s store/ios/assets/worklog-app-store-icon-1024.png
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'minSdk = 24' android/app/build.gradle.kts
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 13.0;' ios/Runner.xcodeproj/project.pbxproj
      - name: Dohvati pakete
        run: flutter pub get
      - name: Provjeri format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analiza
        run: flutter analyze
      - name: Testovi
        run: flutter test

  android:
    name: Android release APK i AAB
    runs-on: ubuntu-latest
    env:
      WORKLOG_ANDROID_KEYSTORE_BASE64: ${{ secrets.WORKLOG_ANDROID_KEYSTORE_BASE64 }}
      WORKLOG_KEYSTORE_PASSWORD: ${{ secrets.WORKLOG_KEYSTORE_PASSWORD }}
      WORKLOG_KEY_ALIAS: ${{ secrets.WORKLOG_KEY_ALIAS }}
      WORKLOG_KEY_PASSWORD: ${{ secrets.WORKLOG_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --org com.brendigo --project-name worklog --platforms android,ios .
      - run: python3 tool/configure_platforms.py
      - run: flutter pub get
      - name: Pripremi produkcijski Android signing ako su tajne dostupne
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${WORKLOG_ANDROID_KEYSTORE_BASE64:-}" ] &&
             [ -n "${WORKLOG_KEYSTORE_PASSWORD:-}" ] &&
             [ -n "${WORKLOG_KEY_ALIAS:-}" ] &&
             [ -n "${WORKLOG_KEY_PASSWORD:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/worklog-upload.jks"
            printf '%s' "$WORKLOG_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "WORKLOG_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "WORKLOG_SIGNING_MODE=production" >> "$GITHUB_ENV"
          else
            echo "WORKLOG_SIGNING_MODE=ci-debug" >> "$GITHUB_ENV"
            echo "::notice::Android produkcijski keystore nije postavljen; CI build će koristiti Flutterov razvojni signing i neće se označiti kao Play Store-ready."
          fi
      - name: Izgradi APK
        run: flutter build apk --release
      - name: Izgradi AAB
        run: flutter build appbundle --release
      - name: Pripremi i provjeri artefakte
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          mkdir -p artifacts/android
          if [ "$WORKLOG_SIGNING_MODE" = "production" ]; then
            APK_NAME="WORKLOG-v${VERSION}-Android.apk"
            AAB_NAME="WORKLOG-v${VERSION}-Android.aab"
            STATUS="production-signed"
          else
            APK_NAME="WORKLOG-v${VERSION}-Android-CI.apk"
            AAB_NAME="WORKLOG-v${VERSION}-Android-CI.aab"
            STATUS="ci-debug-signed-not-for-play"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/android/$APK_NAME"
          cp build/app/outputs/bundle/release/app-release.aab "artifacts/android/$AAB_NAME"
          test -s "artifacts/android/$APK_NAME"
          test -s "artifacts/android/$AAB_NAME"
          printf 'signing=%s\npackage=com.brendigo.worklog\ntargetSdk=36\n' "$STATUS" > artifacts/android/SIGNING-STATUS.txt
          sha256sum "artifacts/android/$APK_NAME" "artifacts/android/$AAB_NAME" > artifacts/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WORKLOG-Android
          path: artifacts/android/*
          if-no-files-found: error

  ios:
    name: iOS release build bez codesigna
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Provjeri Xcode i iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/ {split($2, p, "."); print p[1]}')"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ -z "$XCODE_MAJOR" ] || [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::Potreban je Xcode 26 ili noviji."
            exit 1
          fi
          if [ -z "$SDK_MAJOR" ] || [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::Potreban je iOS 26 SDK ili noviji."
            exit 1
          fi
      - run: flutter create --org com.brendigo --project-name worklog --platforms android,ios .
      - run: python3 tool/configure_platforms.py
      - run: flutter pub get
      - name: Izgradi iOS release
        run: flutter build ios --release --no-codesign
      - name: Pripremi i provjeri iOS artefakt
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          test -d build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' build/ios/iphoneos/Runner.app/Info.plist
          mkdir -p artifacts/ios
          tar -czf "artifacts/ios/WORKLOG-v${VERSION}-iOS-no-codesign.tar.gz" -C build/ios/iphoneos Runner.app
          test -s "artifacts/ios/WORKLOG-v${VERSION}-iOS-no-codesign.tar.gz"
          printf 'signing=none\nbundle=com.brendigo.worklog\nminimumOS=13.0\n' > artifacts/ios/SIGNING-STATUS.txt
          shasum -a 256 "artifacts/ios/WORKLOG-v${VERSION}-iOS-no-codesign.tar.gz" > artifacts/ios/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WORKLOG-iOS-no-codesign
          path: artifacts/ios/*
          if-no-files-found: error
