name: WORKLOG Format Repair

on:
  push:
    branches:
      - develop/worklog-0.9.0-assets-readme-polish

permissions:
  contents: write

concurrency:
  group: worklog-format-repair-090
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/worklog-0.9.0-assets-readme-polish
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Reproduciraj CI okruženje
        run: |
          flutter create --org com.brendigo --project-name worklog --platforms android,ios .
          python3 tool/configure_platforms.py
          flutter pub get
      - name: Primijeni službeni Dart formatter
        run: |
          dart format             lib             test             tool/store_screenshots_test.dart             tool/normalize_store_png.dart
      - name: Commitaj samo formatter promjene
        shell: bash
        run: |
          set -euo pipefail
          git add lib test tool/store_screenshots_test.dart tool/normalize_store_png.dart
          if git diff --cached --quiet; then
            echo "Nema promjena formata."
            exit 0
          fi
          git config user.name "WORKLOG CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "style: primijeni službeni Dart format za 0.9.0"
          git push origin HEAD:develop/worklog-0.9.0-assets-readme-polish
