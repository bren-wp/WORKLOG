name: WORKLOG Format Repair 0.11.0

on:
  push:
    branches:
      - develop/worklog-0.11.0-auth-backend
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/format-repair.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/worklog-0.11.0-auth-backend
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Primijeni službeni Dart format
        run: dart format lib test
      - name: Commit formatter izmjene
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib test; then
            echo "Nema formatter izmjena."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: primijeni službeni Dart format za 0.11.0"
          git push origin HEAD:develop/worklog-0.11.0-auth-backend
