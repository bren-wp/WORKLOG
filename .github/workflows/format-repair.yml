name: WORKLOG Format Repair 0.10.0

on:
  push:
    branches:
      - develop/worklog-0.10.0-search-client-integrity

permissions:
  contents: write

concurrency:
  group: worklog-format-repair-010
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/worklog-0.10.0-search-client-integrity
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Reproduciraj CI okruženje
        run: |
          flutter create --org com.brendigo --project-name worklog --platforms android,ios .
          python3 tool/configure_platforms.py
          flutter pub get
      - name: Primijeni službeni Dart formatter
        run: dart format lib test
      - name: Commitaj samo formatter promjene
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib test; then
            echo "Nema promjena formata."
            exit 0
          fi
          git config user.name "WORKLOG CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib test
          git commit -m "style: primijeni službeni Dart format za 0.10.0"
          git push origin HEAD:develop/worklog-0.10.0-search-client-integrity
