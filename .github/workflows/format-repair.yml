name: WORKLOG Format Repair

on:
  push:
    branches:
      - develop/worklog-0.7.0-timer-lifecycle

permissions:
  contents: write

concurrency:
  group: worklog-format-repair
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/worklog-0.7.0-timer-lifecycle
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Primijeni Dart format
        run: dart format lib test
      - name: Commitaj samo stvarne format promjene
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib test; then
            echo "Nema promjena formata."
            exit 0
          fi
          git config user.name "WORKLOG CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib test
          git commit -m "style: primijeni službeni dart format"
          git push origin HEAD:develop/worklog-0.7.0-timer-lifecycle
