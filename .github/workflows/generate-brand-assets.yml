name: WORKLOG Generate Brand Assets

on:
  push:
    branches:
      - develop/worklog-0.8.0-platform-store

permissions:
  contents: write

concurrency:
  group: worklog-generate-brand-assets
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'store: generiraj WORKLOG brand assete')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/worklog-0.8.0-platform-store
          fetch-depth: 0
      - name: Generiraj store assete
        run: python3 tool/generate_brand_assets.py
      - name: Provjeri izlaz
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/brand/generated/worklog-app-icon-1024.png
          test -s assets/brand/generated/worklog-splash-mark-512.png
          test -s store/android/assets/worklog-app-icon-512.png
          test -s store/android/assets/worklog-feature-graphic-1024x500.png
          test -s store/ios/assets/worklog-app-store-icon-1024.png
      - name: Commitaj generirane assete
        shell: bash
        run: |
          set -euo pipefail
          git add assets/brand/generated store/android/assets store/ios/assets
          if git diff --cached --quiet; then
            echo "Generirani asseti su već ažurni."
            exit 0
          fi
          git config user.name "WORKLOG CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "store: generiraj WORKLOG brand assete"
          git push origin HEAD:develop/worklog-0.8.0-platform-store
